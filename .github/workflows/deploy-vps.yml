name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync server/ to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync server/ to VPS
        run: |
          scp -P ${{ secrets.VPS_PORT }} \
            server/api_server.py \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/dlibras/libras-vision/api_server.py

          scp -P ${{ secrets.VPS_PORT }} \
            server/Dockerfile.api \
            server/docker-compose.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/dlibras/

      - name: Rebuild + restart container
        run: |
          ssh -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/dlibras && docker compose build api && docker compose up -d"

      - name: Health check
        run: |
          sleep 15
          curl --fail --max-time 10 \
            http://${{ secrets.VPS_HOST }}:8801/health \
            | jq -e '.status == "ok"'
