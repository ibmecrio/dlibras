name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --shamefully-hoist --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

  web-build:
    name: Expo web export
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --shamefully-hoist --frozen-lockfile
      - name: expo export
        run: pnpm exec expo export -p web
        env:
          EXPO_PUBLIC_LIBRAS_API_URL: ${{ vars.EXPO_PUBLIC_LIBRAS_API_URL || 'https://api.dlibras.app' }}
          EXPO_PUBLIC_USE_PROXY: 'true'
          EXPO_PUBLIC_PROXY_SECRET: ${{ secrets.EXPO_PUBLIC_PROXY_SECRET }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
