# ─────────────────────────────────────────────────────────────────────
# DLibras — Public-facing nginx (reverse proxy + TLS terminator)
# Lives in the `nginx` container of docker-compose.yml.
# ─────────────────────────────────────────────────────────────────────

# Worker tuning — modest, suitable for a single-node VPS.
worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Basics ──────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset       utf-8;

    # ── Logging ─────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    # ── Performance ─────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 20m;   # frame uploads / TTS audio

    # ── Gzip (brotli is optional, kept off for vanilla nginx:alpine) ─
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── WebSocket upgrade map (for /predict-ws) ─────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams ───────────────────────────────────────────────────
    upstream dlibras_api {
        server api:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream dlibras_web {
        server web:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect (+ ACME http-01 challenge passthrough)
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 187.77.253.138 dlibras.app www.dlibras.app _;

        # Let's Encrypt http-01 challenge files written by certbot.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Everything else → https
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────
    # HTTPS — main site + API reverse proxy
    # ─────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name 187.77.253.138 dlibras.app www.dlibras.app;

        # ── TLS (Let's Encrypt) ─────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/dlibras.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dlibras.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/dlibras.app/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── Security headers ────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

        # ── API: FastAPI predict endpoints ──────────────────────
        # /api/* → wraps the AI proxy routes (Anthropic, ElevenLabs, AssemblyAI)
        # /predict, /predict-landmarks, /predict-motion, /predict-motion-v2 → KNN
        # /health → upstream health
        location ~ ^/(api|predict|predict-landmarks|predict-motion|predict-motion-v2|health)(/.*)?$ {
            proxy_pass http://dlibras_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_buffering off;        # streaming-friendly (Anthropic SSE etc.)
            proxy_request_buffering off;
        }

        # ── WebSocket: live prediction stream ───────────────────
        location = /predict-ws {
            proxy_pass http://dlibras_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;   # long-lived stream
            proxy_send_timeout  3600s;
            proxy_buffering off;
        }

        # ── Web frontend (Expo static export) ───────────────────
        location / {
            proxy_pass http://dlibras_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Long cache for fingerprinted assets emitted by Expo (_expo/static/*).
        location ~* ^/_expo/static/.*\.(?:js|css|map|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
            proxy_pass http://dlibras_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
