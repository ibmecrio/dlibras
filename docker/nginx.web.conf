# ─────────────────────────────────────────────────────────────────────
# DLibras — internal nginx for the `web` container.
# Only the public-facing nginx (docker/nginx.conf) handles TLS; this one
# just serves the Expo static export on port 80 to the docker network.
# ─────────────────────────────────────────────────────────────────────
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip already-compressible assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ── SPA fallback (Expo Router) ──────────────────────────────────
    # First try the literal file, then directory index, then HTML route
    # (e.g. /lesson/abc → /lesson/abc.html or /lesson/[id].html), finally
    # fall back to index.html so client-side routing still works.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── Long cache for hashed Expo assets ───────────────────────────
    location ~* ^/_expo/static/.*\.(?:js|css|map|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── No cache for the HTML shell ─────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # ── Healthcheck endpoint used by the container HEALTHCHECK ──────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
