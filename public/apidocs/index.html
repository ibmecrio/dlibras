<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DLibras API — Documentacao</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Documentacao OpenAPI 3.0 da DLibras Vision API — endpoints /predict, /api/leaderboard, /api/anthropic, /api/elevenlabs, /api/assemblyai">
  <meta name="theme-color" content="#6c4ef5">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: #0e0e15; }
    .topbar {
      background: linear-gradient(90deg, #6c4ef5 0%, #5b3bf6 100%);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(108,78,245,0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-logo {
      width: 36px; height: 36px;
      background: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .topbar h1 {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.3px;
    }
    .topbar .badge {
      color: rgba(255,255,255,0.85);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      margin-left: 8px;
    }
    .topbar-right { display: flex; gap: 10px; }
    .topbar a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.14);
      transition: background 0.18s;
    }
    .topbar a:hover { background: rgba(255,255,255,0.28); }
    redoc { display: block; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🦊</div>
      <h1>DLibras API</h1>
      <span class="badge">OpenAPI 3.0</span>
    </div>
    <div class="topbar-right">
      <a href="/" title="Voltar pro app">← App</a>
      <a href="https://github.com/ibmecrio/dlibras" target="_blank">GitHub</a>
    </div>
  </div>

  <redoc
    spec-url="/openapi.json"
    theme='{
      "colors": {
        "primary": { "main": "#6c4ef5" },
        "success": { "main": "#21c16b" },
        "warning": { "main": "#ffcb00" },
        "error":   { "main": "#ff4d4f" },
        "text":    { "primary": "#001328", "secondary": "#6b7280" }
      },
      "typography": {
        "fontSize": "15px",
        "fontFamily": "Roboto, sans-serif",
        "headings": { "fontFamily": "Montserrat, sans-serif", "fontWeight": "700" },
        "code": { "fontSize": "13px", "fontFamily": "Menlo, monospace" }
      },
      "sidebar": {
        "backgroundColor": "#fafafa",
        "width": "300px"
      },
      "rightPanel": {
        "backgroundColor": "#1c1f2b",
        "width": "40%"
      }
    }'
    hide-download-button="false"
    expand-responses="200,201"
    json-sample-expand-level="2"
    path-in-middle-panel="true"
    required-props-first="true"
    sort-props-alphabetically="false"
    show-extensions="false"
  ></redoc>
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
</body>
</html>
