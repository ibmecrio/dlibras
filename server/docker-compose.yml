services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dlibras-api
    restart: unless-stopped
    ports:
      - "8801:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlibras-net
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: dlibras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dlibras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dlibras}
    volumes:
      - dlibras-dbdata:/var/lib/postgresql/data
    networks:
      - dlibras-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlibras} -d ${POSTGRES_DB:-dlibras}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # web service opcional — adicionar quando repo for tornado publico OU
  # quando deploy key SSH for adicionada no GitHub. Por enquanto o web
  # vive na Vercel (gratis + CDN global + HTTPS automatico).
  # Veja server/Dockerfile.web pra a config quando quiser ativar.

volumes:
  dlibras-dbdata:

networks:
  dlibras-net:
    driver: bridge
  nginx-proxy-manager_default:
    external: true
