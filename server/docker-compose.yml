services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dlibras-api
    restart: unless-stopped
    ports:
      - "8801:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlibras-net
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: dlibras-web
    restart: unless-stopped
    ports:
      - "8802:80"
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
    networks:
      - dlibras-net
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: dlibras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dlibras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dlibras}
    volumes:
      - dlibras-dbdata:/var/lib/postgresql/data
    networks:
      - dlibras-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlibras} -d ${POSTGRES_DB:-dlibras}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel — dá HTTPS na api sem precisar de domínio, NPM ou Let's Encrypt.
  # Modo "quick tunnel" (gratis, sem signup): URL muda a cada restart.
  # Pra URL permanente: criar named tunnel + setar TUNNEL_TOKEN no .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dlibras-cf-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://dlibras-api:8001
    networks:
      - dlibras-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  dlibras-dbdata:

networks:
  dlibras-net:
    driver: bridge
  nginx-proxy-manager_default:
    external: true
